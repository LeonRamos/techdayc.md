<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D0E"/>
      <stop offset="1" stop-color="#15181A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#A3E635" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Eyebrow -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" fill="#9BA3A8">
    <circle cx="80" cy="120" r="6" fill="#A3E635"/>
    <text x="98" y="128">tsj_zapopan / academia_isc</text>
  </g>

  <!-- Title -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="700" fill="#ECECEC">
    <text x="80" y="260" font-size="116" letter-spacing="-4">Tec Tech</text>
    <text x="80" y="380" font-size="116" letter-spacing="-4" fill="#A3E635">Day <tspan font-family="'JetBrains Mono', monospace" font-size="40" fill="#5E666B">/ 2026</tspan></text>
  </g>

  <!-- Meta line -->
  <g font-family="Inter, system-ui, sans-serif" font-size="28" fill="#9BA3A8">
    <text x="80" y="460">Jornada técnica · Ingeniería en Sistemas Computacionales</text>
  </g>

  <!-- Footer line -->
  <g font-family="'JetBrains Mono', monospace" font-size="22" fill="#5E666B">
    <text x="80" y="560">// 28.05.2026 · Edificio L · 9:00 – 12:00</text>
  </g>

  <!-- Logo mark, top-right -->
  <g transform="translate(1040 90)" stroke="#ECECEC" stroke-width="6" fill="none" stroke-linecap="square">
    <path d="M22 14 L4 14 L4 96 L22 96"/>
    <path d="M82 14 L100 14 L100 96 L82 96"/>
    <path d="M30 36 L74 36"/>
    <path d="M52 36 L52 82"/>
    <circle cx="52" cy="90" r="4" fill="#A3E635" stroke="none"/>
  </g>
</svg>
